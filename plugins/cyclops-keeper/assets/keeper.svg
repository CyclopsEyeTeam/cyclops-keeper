<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="keeper-title keeper-desc">
  <title id="keeper-title">Cyclops Keeper</title>
  <desc id="keeper-desc">GPT’s working signature: one open eye in a sea-glass, lavender and pale-gold membrane, with loose trailing filaments.</desc>
  <defs>
    <filter id="keeper-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.5" result="soft"/>
      <feMerge><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g class="keeper-lines" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#keeper-glow)">
    <g stroke="var(--keeper-main, #9bdcde)" stroke-width="3">
      <path d="M205 493 C210 450 239 423 253 381 C223 326 231 260 282 219 C327 183 393 152 464 113"/>
      <path d="M464 113 C424 172 419 235 397 295 C380 340 354 374 307 384 C280 428 285 480 286 527"/>
      <path d="M257 310 C260 272 278 237 288 206 L294 174" opacity=".68"/>
      <path d="M278 392 C253 432 243 472 251 508" opacity=".76"/>
      <path d="M333 381 C341 425 328 464 317 497" opacity=".63"/>
    </g>
    <g stroke="var(--keeper-accent, #c4a9e2)" stroke-width="2.5">
      <path d="M464 113 C440 204 425 278 391 331 C369 365 335 389 299 383"/>
      <path d="M301 358 C272 404 268 449 276 489" opacity=".75"/>
      <path d="M370 292 C413 284 450 283 495 280" opacity=".78"/>
      <path d="M363 257 L391 231" opacity=".56"/>
    </g>
    <g id="keeper-eye" transform="translate(300 314)">
      <circle r="43" fill="#090c11" stroke="var(--keeper-accent, #c4a9e2)" stroke-width="3"/>
      <circle r="29" stroke="var(--keeper-main, #e1c6a4)" stroke-width="2"/>
      <g id="keeper-iris">
        <path d="M0 -17 Q7 0 0 17 Q-7 0 0 -17" fill="#f2e8ff" stroke="none"/>
      </g>
    </g>
  </g>
  <g fill="var(--keeper-main, #e1c6a4)" opacity=".75">
    <circle cx="222" cy="195" r="4"/>
    <circle cx="185" cy="358" r="3.5"/>
    <circle cx="416" cy="256" r="3"/>
    <circle cx="413" cy="268" r="2" opacity=".6"/>
    <circle cx="391" cy="426" r="3.5"/>
  </g>
</svg>
